server:
  port: 8080
  servlet:
    context-path: /api

spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:ruankao_study}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:rootroot}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      encoding: UTF-8
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
mybatis:
  mapper-locations: classpath:/mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

app:
  software:
    name: ${APP_SOFTWARE_NAME:知行软考学习与知识管理系统}
    version: ${APP_SOFTWARE_VERSION:V1.0}
    purpose: ${APP_SOFTWARE_PURPOSE:面向信息系统项目管理师备考的学习计划、题库练习与知识管理}
    developer: ${APP_SOFTWARE_DEVELOPER:邹军科}
    copyright: ${APP_SOFTWARE_COPYRIGHT:版权所有}
  admin:
    username: ${APP_ADMIN_USERNAME:admin}
  jwt:
    # 生产环境必须通过 JWT_SECRET 环境变量替换默认开发密钥，且至少 32 字节。
    secret: ${JWT_SECRET:ruankao-study-system-jwt-secret-change-in-production-2026}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}

logging:
  level:
    org.hibernate.SQL: warn
