server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:ruankao_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-test.sql

app:
  admin:
    username: admin
  database-migration:
    enabled: false
  jwt:
    secret: test-jwt-secret-for-local-integration-only-2026
    expiration-minutes: 120
